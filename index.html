<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1b"><title>SONAR — Sound made visible</title><style>*{box-sizing:border-box}body{margin:0;background:#080f1b;color:#e8f5ff;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:24px 16px 70px}h1{color:#59d8ff;letter-spacing:3px;margin:0}small,.hint{color:#91aabe}.hint{font-size:12px;line-height:1.7}.card{background:#111f30;border:1px solid #294059;border-radius:18px;padding:17px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.big{font-size:clamp(21px,5vw,32px);font-weight:750}.label{color:#91aabe;font-size:12px}button{border:1px solid #36516b;background:#20364e;color:white;border-radius:10px;padding:11px 13px;cursor:pointer;font:inherit}button.active,button.primary{background:#008ec4;border-color:#39c8ff}button:disabled{opacity:.4}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}canvas{width:100%;display:block;background:#091525;border-radius:9px}#plot{height:260px}#heat{height:180px}#history>div{padding:10px 0;border-top:1px solid #2b4057;font-size:13px}</style><main class="wrap"><header class="row"><div><h1>〰 SONAR</h1><small>Sound, made visible.</small></div><small id="status">待機中</small></header><section class="card"><div class="row"><div><div class="label">ピーク周波数</div><div class="big" id="peak">— Hz</div></div><div style="text-align:right"><div class="label">ピークレベル</div><div class="big" id="level">— dBFS</div></div></div><p class="hint" id="message">測定開始でマイクの許可を求めます。音声は端末内で解析され、送信されません。</p><div class="controls"><button class="primary" id="start">● 測定開始</button><button id="save" disabled>測定を保存</button><button id="clear">履歴を消去</button></div></section><section class="card"><div class="controls"><button data-mode="full" class="active">全周波数</button><button data-mode="low">低周波 20–200Hz</button><button data-mode="mid">20–1000Hz</button></div><div style="height:12px"></div><canvas id="plot"></canvas><p class="hint">横軸：周波数（対数）／縦軸：dBFS。校正済み騒音計のdB SPLとは異なります。</p></section><section class="card"><div class="row"><strong>スペクトログラム</strong><small>右端が最新</small></div><div style="height:12px"></div><canvas id="heat"></canvas><p class="hint">選択した周波数範囲の時間変化を表示します。</p></section><section class="card"><div class="row"><strong>測定履歴</strong><small>この端末に保存</small></div><div id="history"></div></section><p class="hint">SONAR Web v1.0｜HTTPSまたはlocalhostが必要です。スマートフォンのマイクは低周波を抑制する場合があります。測定中は画面を開いたままにしてください。</p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let audio,source,stream,analyser,buf,raf,mode='full',running=false,history=[];try{history=JSON.parse(localStorage.getItem('sonar-history')||'[]')}catch{}const ranges={full:[20,20000],low:[20,200],mid:[20,1000]},plot=$('plot'),heat=$('heat'),pc=plot.getContext('2d'),hc=heat.getContext('2d');function resize(c){let d=Math.min(devicePixelRatio||1,2),w=Math.max(200,c.clientWidth),h=c===plot?c.clientHeight:180;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}return{w:c.width,h:c.height}}function logx(f,a,b,w){return Math.log(f/a)/Math.log(b/a)*w}function paint(){if(!running)return;analyser.getFloatFrequencyData(buf);const{w,h}=resize(plot),[lo,hi]=ranges[mode];pc.fillStyle='#091525';pc.fillRect(0,0,w,h);pc.strokeStyle='#24374b';pc.fillStyle='#90a9bc';pc.font='12px system-ui';for(let db=-100;db<=0;db+=20){let y=-db/110*h;pc.beginPath();pc.moveTo(0,y);pc.lineTo(w,y);pc.stroke();pc.fillText(String(db),4,Math.max(12,Math.min(h-5,y-3)))}for(let f of [20,31.5,50,63,100,125,200,250,500,1000,2000,4000,8000,16000,20000]){if(f<lo||f>hi)continue;let x=logx(f,lo,hi,w);pc.beginPath();pc.moveTo(x,0);pc.lineTo(x,h);pc.stroke();pc.fillText(f>=1000?f/1000+'k':String(f),Math.min(w-30,x+3),h-6)}let best=-Infinity,bf=0,started=false;pc.beginPath();for(let i=1;i<buf.length;i++){let f=i*audio.sampleRate/analyser.fftSize;if(f<lo||f>hi)continue;let v=buf[i];if(!Number.isFinite(v))continue;if(v>best){best=v;bf=f}let x=logx(f,lo,hi,w),y=Math.max(0,Math.min(h,-v/110*h));if(!started){pc.moveTo(x,y);started=true}else pc.lineTo(x,y)}pc.strokeStyle='#53d9ff';pc.lineWidth=2;pc.stroke();$('peak').textContent=bf?Math.round(bf).toLocaleString('ja-JP')+' Hz':'— Hz';$('level').textContent=Number.isFinite(best)?best.toFixed(1)+' dBFS':'— dBFS';const sz=resize(heat),sw=sz.w,sh=sz.h;hc.drawImage(heat,-2,0,sw,sh);let im=hc.createImageData(2,sh);for(let y=0;y<sh;y++){let f=hi*Math.pow(lo/hi,y/sh),i=Math.min(buf.length-1,Math.round(f*analyser.fftSize/audio.sampleRate)),v=buf[i],z=Math.max(0,Math.min(1,(v+105)/85));for(let x=0;x<2;x++){let p=(y*2+x)*4;im.data[p]=15+240*Math.max(0,z-.5)*2;im.data[p+1]=35+200*z;im.data[p+2]=70+130*(1-z);im.data[p+3]=255}}hc.putImageData(im,sw-2,0);raf=requestAnimationFrame(paint)}function showHistory(){$('history').replaceChildren();if(!history.length){$('history').textContent='まだ記録はありません';return}for(let item of history.slice().reverse()){let d=document.createElement('div');d.textContent=item.date+' ｜ '+item.mode+' ｜ '+item.peak+' ｜ '+item.level;$('history').appendChild(d)}}async function stop(){running=false;cancelAnimationFrame(raf);try{source?.disconnect()}catch{}stream?.getTracks().forEach(t=>t.stop());if(audio)await audio.close().catch(()=>{});audio=source=stream=null;$('start').textContent='● 測定開始';$('save').disabled=true;$('status').textContent='待機中'}$('start').onclick=async()=>{if(running){await stop();return}if(!navigator.mediaDevices?.getUserMedia){$('message').textContent='マイクが利用できません。HTTPSのSafariまたはChromeで開いてください。';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();source=audio.createMediaStreamSource(stream);analyser=audio.createAnalyser();analyser.fftSize=16384;analyser.smoothingTimeConstant=.7;analyser.minDecibels=-110;analyser.maxDecibels=0;source.connect(analyser);buf=new Float32Array(analyser.frequencyBinCount);running=true;$('start').textContent='■ 測定停止';$('save').disabled=false;$('status').textContent='測定中';$('message').textContent='端末内で周波数解析中。測定値はマイクの特性に依存します。';paint()}catch(e){await stop();$('message').textContent='マイクを開始できませんでした：'+e.message}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));hc.clearRect(0,0,heat.width,heat.height)});$('save').onclick=()=>{if(!running)return;history.push({date:new Date().toLocaleString('ja-JP'),mode,peak:$('peak').textContent,level:$('level').textContent});history=history.slice(-100);try{localStorage.setItem('sonar-history',JSON.stringify(history))}catch{}showHistory()};$('clear').onclick=()=>{if(confirm('保存した測定履歴を削除しますか？')){history=[];localStorage.removeItem('sonar-history');showHistory()}};showHistory();addEventListener('pagehide',()=>{if(running)stop()})})();</script></html>
